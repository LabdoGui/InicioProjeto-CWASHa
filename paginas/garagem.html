<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seus veículos — Carwash</title>
<meta name="description" content="Carwash: agende a lavagem do seu carro ou moto em poucos toques.">
<meta name="theme-color" content="#F8FAFC">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Tema claro/escuro: roda antes de tudo para a tela não piscar -->
<script src="../js/tema.js"></script>
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body data-tela="garage">
<div id="app" class="app">
<header class="top">
  <div class="brand"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" style="fill:var(--primary)"/><path d="M24 9.5c5.6 7 10 11.6 10 17a10 10 0 0 1-20 0c0-5.4 4.4-10 10-17z" fill="#fff"/><path d="M19.2 27.5a5 5 0 0 0 4 4.8" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round"/><path d="M36.5 8.5l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z" fill="#fff"/></svg><span>Carwash</span></div>
  <div class="theme" role="group" aria-label="Tema do aplicativo">
    <button type="button" data-act="theme" data-t="light" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Claro</button>
    <button type="button" data-act="theme" data-t="dark" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Escuro</button>
  </div>
</header>

<main id="main" tabindex="-1">
<ol class="stepper" aria-label="Etapas do agendamento"><li class="now" aria-current="step"><i></i>Veículo</li><li class=""><i></i>Serviço</li><li class=""><i></i>Local</li><li class=""><i></i>Horário</li><li class=""><i></i>Pagar</li></ol>
<h1>Olá <span data-nome></span>, gostaria de usar qual veículo?</h1>
<p class="sub">Escolha um veículo salvo ou cadastre um novo.</p>

<!-- Lista dos veículos do cliente (preenchida pelo js/telas-cliente.js) -->
<div id="lista-veiculos"></div>

<form class="card stack" data-form="vehicle" id="form-veiculo" novalidate hidden>
  <h2 style="font-size:17px">Cadastrar veículo</h2>
  <div>
    <div class="small" style="font-weight:600;margin-bottom:8px" id="catlbl">Categoria</div>
    <div class="seg" role="radiogroup" aria-labelledby="catlbl">
      <button type="button" role="radio" aria-checked="true" data-act="selCat" data-v="Carro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l1.8-5A2 2 0 0 1 6.7 6.7h10.6a2 2 0 0 1 1.9 1.3L21 13"/><rect x="3" y="13" width="18" height="5" rx="1.5"/><circle cx="7.5" cy="18" r="1.7"/><circle cx="16.5" cy="18" r="1.7"/></svg>Carro</button>
      <button type="button" role="radio" aria-checked="false" data-act="selCat" data-v="Moto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="16" r="3"/><circle cx="18.5" cy="16" r="3"/><path d="M5.5 16l3-6h5l3 6"/><path d="M13.5 10l-1.5-3h-2.5M15.5 7H18"/></svg>Moto</button>
    </div>
  </div>
  <div>
    <div class="small" style="font-weight:600;margin-bottom:8px" id="sublbl">Tipo</div>
    <div class="chips" role="radiogroup" aria-labelledby="sublbl" id="tipos"></div>
  </div>
  <div class="field" data-f="model"><label for="model">Modelo</label><input id="model" name="model" type="text" placeholder="Ex.: Corolla" value="" aria-describedby="model-err" data-gv="model" autocomplete="off"><div class="hint"></div><div class="err" id="model-err" role="alert"></div></div>
  <div class="field" data-f="color"><label for="color">Cor</label><input id="color" name="color" list="colors" placeholder="Ex.: Prata" value="" data-gv="color" autocomplete="off" aria-describedby="color-err"><datalist id="colors"></datalist><div class="hint"></div><div class="err" id="color-err" role="alert"></div></div>
  <div class="field" data-f="plate"><label for="plate">Placa (padrão Mercosul)</label><input id="plate" name="plate" type="text" placeholder="ABC1D23" value="" aria-describedby="plate-err" data-gv="plate" data-mask="plate" maxlength="7" autocapitalize="characters" autocomplete="off"><div class="hint">3 letras, 1 número, 1 letra e 2 números.</div><div class="err" id="plate-err" role="alert"></div></div>
  <button class="btn primary" type="submit">Salvar veículo</button>
</form>
<button class="btn ghost" data-act="showForm" id="btn-novo-veiculo" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Cadastrar novo veículo</button>

<div style="margin-top:18px"><button class="btn primary" id="continuar" data-act="go" data-to="services" disabled>Continuar</button></div>
</main>

<footer class="foot"><button class="linkbtn" data-act="logout">Sair da conta</button><br>Carwash · Qualidade e Brilho Impecável para o seu Veículo</footer>

</div>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p style="padding:24px">O Carwash precisa de JavaScript para funcionar.</p></noscript>

<!-- Programação: os mesmos arquivos em todas as páginas; app.js sempre por último -->
<script src="../js/qrcode.js"></script>
<script src="../js/utilidades.js"></script>
<script src="../js/icones-e-logotipo.js"></script>
<script src="../js/config.js"></script>
<script src="../js/validacoes.js"></script>
<script src="../js/interface.js"></script>
<script src="../js/regras-de-negocio.js"></script>
<script src="../js/pix.js"></script>
<script src="../js/agenda-e-whatsapp.js"></script>
<script src="../js/telas-cliente.js"></script>
<script src="../js/painel-admin.js"></script>
<script src="../js/janelas.js"></script>
<script src="../js/navegacao.js"></script>
<script src="../js/eventos.js"></script>
<script src="../js/dados-demonstracao.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
