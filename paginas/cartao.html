<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cartão — Carwash</title>
<meta name="description" content="Carwash: agende a lavagem do seu carro ou moto em poucos toques.">
<meta name="theme-color" content="#F8FAFC">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Tema claro/escuro: roda antes de tudo para a tela não piscar -->
<script src="../js/tema.js"></script>
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body data-tela="card">
<div id="app" class="app">
<header class="top">
  <div class="brand"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" style="fill:var(--primary)"/><path d="M24 9.5c5.6 7 10 11.6 10 17a10 10 0 0 1-20 0c0-5.4 4.4-10 10-17z" fill="#fff"/><path d="M19.2 27.5a5 5 0 0 0 4 4.8" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round"/><path d="M36.5 8.5l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z" fill="#fff"/></svg><span>Carwash</span></div>
  <div class="theme" role="group" aria-label="Tema do aplicativo">
    <button type="button" data-act="theme" data-t="light" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Claro</button>
    <button type="button" data-act="theme" data-t="dark" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Escuro</button>
  </div>
</header>

<main id="main" tabindex="-1">
<button class="linkbtn" data-act="go" data-to="checkout" style="display:inline-flex;align-items:center;gap:4px;text-decoration:none;margin:-4px 0 8px -6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Voltar</button>
<h1>Pagamento com cartão</h1>
<p class="sub">Total: <b data-total></b></p>
<form class="card stack" data-form="card" novalidate>
  <div class="field" data-f="cnum"><label for="cnum">Número do cartão</label><input id="cnum" name="cnum" type="text" placeholder="0000 0000 0000 0000" value="" aria-describedby="cnum-err" inputmode="numeric" autocomplete="cc-number" data-mask="card"><div class="hint"><span id="cbrand"></span></div><div class="err" id="cnum-err" role="alert"></div></div>
  <div class="field" data-f="cname"><label for="cname">Nome impresso no cartão</label><input id="cname" name="cname" type="text" placeholder="MARIA DA SILVA" value="" aria-describedby="cname-err" autocomplete="cc-name" autocapitalize="characters" data-mask="upper"><div class="hint"></div><div class="err" id="cname-err" role="alert"></div></div>
  <div class="row2"><div class="field" data-f="cexp"><label for="cexp">Validade</label><input id="cexp" name="cexp" type="text" placeholder="MM/AA" value="" aria-describedby="cexp-err" inputmode="numeric" maxlength="5" autocomplete="cc-exp" data-mask="exp"><div class="hint"></div><div class="err" id="cexp-err" role="alert"></div></div><div class="field" data-f="ccvv"><label for="ccvv">CVV</label><input id="ccvv" name="ccvv" type="password" placeholder="123" value="" aria-describedby="ccvv-err" inputmode="numeric" maxlength="4" autocomplete="cc-csc" data-mask="cvv"><div class="hint"></div><div class="err" id="ccvv-err" role="alert"></div></div></div>
  <label style="display:flex;gap:10px;align-items:flex-start;font-size:14px"><input type="checkbox" id="csave" checked style="width:20px;height:20px;accent-color:var(--primary);margin-top:1px"><span>Salvar cartão para próximas lavagens<br><span class="muted small">Guardamos apenas bandeira, final, titular e validade — nunca o número completo nem o CVV.</span></span></label>
  <p class="notice">Ambiente de demonstração: nenhuma cobrança real é feita.</p>
  <button class="btn primary" type="submit">Pagar <span data-total></span></button>
</form>
</main>

<footer class="foot"><button class="linkbtn" data-act="logout">Sair da conta</button><br>Carwash · Qualidade e Brilho Impecável para o seu Veículo</footer>

</div>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p style="padding:24px">O Carwash precisa de JavaScript para funcionar.</p></noscript>

<!-- Programação: os mesmos arquivos em todas as páginas; app.js sempre por último -->
<script src="../js/qrcode.js"></script>
<script src="../js/utilidades.js"></script>
<script src="../js/icones-e-logotipo.js"></script>
<script src="../js/config.js"></script>
<script src="../js/validacoes.js"></script>
<script src="../js/interface.js"></script>
<script src="../js/regras-de-negocio.js"></script>
<script src="../js/pix.js"></script>
<script src="../js/agenda-e-whatsapp.js"></script>
<script src="../js/telas-cliente.js"></script>
<script src="../js/painel-admin.js"></script>
<script src="../js/janelas.js"></script>
<script src="../js/navegacao.js"></script>
<script src="../js/eventos.js"></script>
<script src="../js/dados-demonstracao.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
