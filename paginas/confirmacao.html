<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agendamento confirmado — Carwash</title>
<meta name="description" content="Carwash: agende a lavagem do seu carro ou moto em poucos toques.">
<meta name="theme-color" content="#F8FAFC">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Tema claro/escuro: roda antes de tudo para a tela não piscar -->
<script src="../js/tema.js"></script>
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body data-tela="confirm">
<div id="app" class="app">
<header class="top">
  <div class="brand"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" style="fill:var(--primary)"/><path d="M24 9.5c5.6 7 10 11.6 10 17a10 10 0 0 1-20 0c0-5.4 4.4-10 10-17z" fill="#fff"/><path d="M19.2 27.5a5 5 0 0 0 4 4.8" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round"/><path d="M36.5 8.5l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z" fill="#fff"/></svg><span>Carwash</span></div>
  <div class="theme" role="group" aria-label="Tema do aplicativo">
    <button type="button" data-act="theme" data-t="light" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Claro</button>
    <button type="button" data-act="theme" data-t="dark" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Escuro</button>
  </div>
</header>

<main id="main" tabindex="-1">
<div class="center">
  <div class="okmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></div>
  <h1>Agendamento confirmado!</h1>
  <p class="sub">Código <span class="code" id="codigo"></span></p>
</div>
<div class="card sum">
  <div><span>Cliente</span><span id="r-cliente"></span></div>
  <div><span>Veículo</span><span id="r-veiculo"></span></div>
  <div><span>Serviço</span><span id="r-servico"></span></div>
  <div><span>Unidade</span><span id="r-unidade"></span></div>
  <div><span>Data e hora</span><span id="r-data"></span></div>
  <div><span>Pagamento</span><span id="r-pagamento"></span></div>
  <div class="total"><span>Total</span><span id="r-total"></span></div>
</div>
<div class="stack" style="margin-top:18px">
  <a class="btn wa" id="link-whatsapp" target="_blank" rel="noopener" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.6-2-1-1 .8a4 4 0 0 1-2-2l.8-1-1-2z"/></svg><span style="display:flex;flex-direction:column;align-items:center;line-height:1.2">Enviar por WhatsApp<small style="font-weight:500;opacity:.9" id="whatsapp-numero"></small></span></a>
  <a class="btn outline" id="link-agenda" target="_blank" rel="noopener" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span id="agenda-nome">Adicionar à Agenda</span></a>
  <button class="btn ghost" data-act="ics">Baixar arquivo .ics</button>
  <button class="btn primary" data-act="newBooking">Novo agendamento</button>
</div>
</main>

<footer class="foot"><button class="linkbtn" data-act="logout">Sair da conta</button><br>Carwash · Qualidade e Brilho Impecável para o seu Veículo</footer>

</div>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p style="padding:24px">O Carwash precisa de JavaScript para funcionar.</p></noscript>

<!-- Programação: os mesmos arquivos em todas as páginas; app.js sempre por último -->
<script src="../js/qrcode.js"></script>
<script src="../js/utilidades.js"></script>
<script src="../js/icones-e-logotipo.js"></script>
<script src="../js/config.js"></script>
<script src="../js/validacoes.js"></script>
<script src="../js/interface.js"></script>
<script src="../js/regras-de-negocio.js"></script>
<script src="../js/pix.js"></script>
<script src="../js/agenda-e-whatsapp.js"></script>
<script src="../js/telas-cliente.js"></script>
<script src="../js/painel-admin.js"></script>
<script src="../js/janelas.js"></script>
<script src="../js/navegacao.js"></script>
<script src="../js/eventos.js"></script>
<script src="../js/dados-demonstracao.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
